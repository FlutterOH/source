name: Package manifest intake
description: Request adding an official package manifest for the first time.
title: "[Package intake] "
labels:
  - packages
body:
  - type: markdown
    attributes:
      value: |
        Use this only for first-time source intake after the package repository already has published FlutterOH package release metadata from `fluoh package release`.
        For corrections to existing package manifests, advisory text, maintenance state, repository paths, or sync behavior, use the Source data issue template instead.
        Use title format: `[Package intake] <package-name>`, for example `[Package intake] camera`.
        Provide only the manifest route name, package name, package repository, and published release tag. Reviewers or automation can use those values to fetch and verify release metadata.
        The manifest route name is declared in root `fluoh.yaml` and must match `package.name` in the manifest file. It is usually the package name. For example, `camera` maps to `manifests/camera/fluoh.yaml`.
        In-progress or unfinished adaptations should stay in the package repository and should not be added to the official source.
        Adaptation code should stay in the package repository, not in `FlutterOH/source`.
        The first `FlutterOH/source` pull request must add both the root `fluoh.yaml` manifest route entry and `manifests/<manifest-name>/fluoh.yaml`.
        After the first manifest pull request is merged, new package releases normally need only new package repository release tags; scheduled sync can import them without a new `FlutterOH/source` pull request.
  - type: input
    id: manifest-name
    attributes:
      label: Manifest route name
      description: Route name declared in root `fluoh.yaml`; it must match `package.name` in the manifest file. For example, `camera` maps to `manifests/camera/fluoh.yaml`.
      placeholder: camera
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package name
      placeholder: camera
    validations:
      required: true
  - type: input
    id: implementation-repository
    attributes:
      label: FlutterOH package repository
      placeholder: https://github.com/FlutterOH/camera.git
    validations:
      required: true
  - type: input
    id: release-tag
    attributes:
      label: Published release tag
      description: Tag created by `fluoh package release`.
      placeholder: camera-0.11.0-ohos-3.35-0.1.0
    validations:
      required: true
  - type: checkboxes
    id: basic-checks
    attributes:
      label: Basic checks
      description: Confirm the request is ready for source intake before reviewers or automation re-check it.
      options:
        - label: The release tag was created by `fluoh package release` and points to the intended package release.
          required: true
        - label: The package repository contains its package-owned `fluoh.yaml` at the published release tag.
          required: true
        - label: This is not an in-progress or unfinished adaptation.
          required: true
        - label: This request only asks for official source metadata; package adaptation code remains outside `FlutterOH/source`.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional context for reviewers, such as known warnings, advisory text, or related package repository PRs.
      placeholder: |
        Optional maintainer notes.
    validations:
      required: false
