name: Package manifest intake
description: Request first-time intake of a released FlutterOH package manifest.
title: "[Package intake] "
labels:
  - packages
body:
  - type: markdown
    attributes:
      value: |
        Use this only for first-time official source intake after the package repository has published a release tag with `fluoh package release`.
        The package repository should already have completed its package-side release gates before publishing the tag.
        If you have package report or check output, include it below as verification context; maintainers will still verify the published tag.
        In-progress adaptations, package code, and package-owned metadata stay in the package repository.
        For existing manifest corrections, advisory text, maintenance state, repository/path fixes, or sync behavior, use the Source data issue template.
        After the first manifest is merged, normal package release records are imported by scheduled sync and do not need a new Source PR.
  - type: input
    id: manifest-name
    attributes:
      label: Manifest route name
      description: Route name declared in root `fluoh.yaml`; it must match `package.name` in the manifest file. For example, `camera` maps to `manifests/camera/fluoh.yaml`.
      placeholder: camera
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package name
      description: Package name recorded in the package-owned `fluoh.yaml`.
      placeholder: camera
    validations:
      required: true
  - type: input
    id: sdk-line
    attributes:
      label: SDK line
      description: FlutterOH SDK line implemented by the published release.
      placeholder: "3.35"
    validations:
      required: true
  - type: input
    id: implementation-repository
    attributes:
      label: FlutterOH package repository
      description: Repository containing the package release tag.
      placeholder: https://github.com/FlutterOH/camera.git
    validations:
      required: true
  - type: input
    id: release-tag
    attributes:
      label: Published release tag
      description: Tag created by `fluoh package release`.
      placeholder: camera-0.11.0-ohos-3.35-0.1.0
    validations:
      required: true
  - type: textarea
    id: release-context
    attributes:
      label: Package release verification context
      description: Optional. Link or summarize package-side report/check output for the published tag if you have it. Maintainers can verify the release tag independently.
      placeholder: |
        report: .fluoh/reports/<scope>/report-<timestamp>.md
        check_report.py: passed
        independent review: passed
        fluoh package check --package <name> --report <report-path> --json: passed
    validations:
      required: false
  - type: checkboxes
    id: basic-checks
    attributes:
      label: Intake confirmation
      description: Confirm the request is ready for source intake before maintainers re-check it.
      options:
        - label: The release tag was created by `fluoh package release` and points to the intended package release.
          required: true
        - label: I understand Source maintainers will verify package-side release gates from the published tag and may block intake if those gates are missing or incomplete.
          required: true
        - label: If I maintain the package repository, the canonical report, `check_report.py`, independent review, and `fluoh package check --report <report-path>` gates are complete.
          required: false
        - label: The package repository contains its package-owned `fluoh.yaml` at the published release tag.
          required: true
        - label: This is not an in-progress or unfinished adaptation.
          required: true
        - label: This request only asks for official source metadata; package adaptation code remains outside `FlutterOH/source`.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional maintainer context, such as warnings, advisory text, or related package repository PRs.
      placeholder: |
        Optional maintainer notes.
    validations:
      required: false
