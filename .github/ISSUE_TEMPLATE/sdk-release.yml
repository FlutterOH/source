name: SDK release update
description: Request adding, changing, or removing an official FlutterOH SDK version.
title: "[SDK] "
labels:
  - sdk
body:
  - type: markdown
    attributes:
      value: |
        Use this for SDK version metadata in root `fluoh.yaml`.
        Add only complete SDK tags that exist in the configured SDK repository and should be visible through `fluoh sdk list`.
  - type: input
    id: version
    attributes:
      label: SDK version tag
      description: Complete FlutterOH SDK tag.
      placeholder: 3.35.8-ohos-1.0.1
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: SDK repository
      placeholder: https://gitcode.com/CPF-Flutter/flutter_flutter.git
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: Requested action
      options:
        - Add version
        - Remove version
        - Correct version metadata
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: SDK tag reference
      description: Link the tag, paste a lookup command result, or explain why the metadata should be removed or corrected. Local metadata edits should pass `fluoh source check . --schema-only`; release verification should pass `fluoh source check .`.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: User impact
      description: Describe who should consume this SDK version and whether older versions should remain listed.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: Added SDK versions exist as tags in the SDK repository.
          required: false
        - label: Added SDK versions should be visible through `fluoh sdk list`.
          required: false
        - label: Removing or correcting SDK metadata has been called out in the user impact section.
          required: false
