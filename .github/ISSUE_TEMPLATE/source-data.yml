name: Source data issue
description: Report incorrect official source data, documentation, templates, or CI.
title: "[Source] "
labels:
  - source
body:
  - type: markdown
    attributes:
      value: |
        Use this for `FlutterOH/source` source data and maintainer workflow.
        Use the Package manifest intake template only for first-time package manifests that already have published release tags.
        Existing package manifest corrections, advisory updates, maintenance changes, and sync issues belong here.
        CLI behavior, project creation or dependency workflows, app workflow commands, and device commands belong in the `FlutterOH/fluoh` repository.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Root fluoh.yaml
        - SDK releases
        - Package manifests
        - Scheduled sync or release-record import
        - README or contributing docs
        - Issue or pull request templates
        - GitHub Actions workflow
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Affected path or route
      description: Optional file path, manifest route, package name, SDK version, or workflow name.
      placeholder: manifests/camera/fluoh.yaml
    validations:
      required: false
  - type: textarea
    id: current
    attributes:
      label: Current state
      description: Describe the incorrect data, missing guidance, or workflow problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected state
      description: Describe what the official source should publish or document instead.
    validations:
      required: true
  - type: textarea
    id: supporting-details
    attributes:
      label: Supporting details
      description: Optional file paths, source snippets, command output, tags, or workflow links.
      placeholder: |
        fluoh source sync .
        fluoh source check --skip-release-checks .
    validations:
      required: false
