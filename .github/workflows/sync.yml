name: sync source

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source
          ref: main
          fetch-depth: 0

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install fluoh
        run: |
          install_fluoh_from_source() {
            if [ ! -d fluoh ]; then
              git clone --depth 1 https://github.com/FlutterOH/fluoh.git fluoh
            fi
            dart pub global activate --source path fluoh --overwrite
          }

          if dart pub global activate fluoh --overwrite; then
            echo "Installed fluoh from pub.dev."
          else
            echo "pub.dev install failed; falling back to FlutterOH/fluoh default branch."
            install_fluoh_from_source
          fi

          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.pub-cache/bin:$PATH"
          fluoh --version

      - name: Check manifests
        id: manifests
        working-directory: source
        run: |
          ruby <<'RUBY'
          require "yaml"

          root = YAML.load_file("fluoh.yaml")
          manifests = root["manifests"]
          has_manifests = manifests.is_a?(Array) && manifests.any?

          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            output.puts("has_manifests=#{has_manifests}")
          end

          if has_manifests
            puts "Manifests found; source sync will run."
          else
            puts "No manifests configured; source sync is not needed."
          end
          RUBY

      - name: Sync package release records
        if: steps.manifests.outputs.has_manifests == 'true'
        working-directory: source
        run: fluoh source sync .

      - name: Check synced source data
        if: steps.manifests.outputs.has_manifests == 'true'
        working-directory: source
        run: |
          fluoh source check --skip-release-checks .
          git diff --check

      - name: Commit synced source to main
        if: steps.manifests.outputs.has_manifests == 'true'
        working-directory: source
        run: |
          if git diff --quiet; then
            echo "No source data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fluoh.yaml manifests
          git commit -m "chore: sync source data"
          git pull --rebase origin main
          fluoh source check --base-ref origin/main --skip-release-checks .
          git diff --check origin/main...HEAD
          git push origin HEAD:main
