name: validate source

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install fluoh
        run: |
          if dart pub global activate fluoh --overwrite; then
            echo "Installed fluoh from pub.dev."
          else
            echo "pub.dev install failed; falling back to FlutterOH/fluoh default branch."
            git clone --depth 1 https://github.com/FlutterOH/fluoh.git fluoh
            dart pub global activate --source path fluoh --overwrite
          fi

          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.pub-cache/bin:$PATH"
          fluoh --version

      - name: Validate official source
        working-directory: source
        run: fluoh source validate
