name: validate source

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install fluoh
        run: |
          install_fluoh_from_source() {
            if [ ! -d fluoh ]; then
              git clone --depth 1 https://github.com/FlutterOH/fluoh.git fluoh
            fi
            dart pub global activate --source path fluoh --overwrite
          }

          if dart pub global activate fluoh --overwrite; then
            echo "Installed fluoh from pub.dev."
          else
            echo "pub.dev install failed; falling back to FlutterOH/fluoh default branch."
            install_fluoh_from_source
          fi

          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.pub-cache/bin:$PATH"
          fluoh --version

      - name: Check official source
        working-directory: source
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/fluoh-source-check.log"

          case "${{ github.event_name }}" in
            pull_request)
              command_text="fluoh source check --base-ref origin/${{ github.base_ref }} ."
              check_command=(fluoh source check --base-ref "origin/${{ github.base_ref }}" .)
              ;;
            push)
              before_ref="${{ github.event.before }}"
              if [ -n "$before_ref" ] && [ "$before_ref" != "0000000000000000000000000000000000000000" ]; then
                command_text="fluoh source check --base-ref $before_ref --skip-release-checks ."
                check_command=(fluoh source check --base-ref "$before_ref" --skip-release-checks .)
              else
                command_text="fluoh source check --skip-release-checks ."
                check_command=(fluoh source check --skip-release-checks .)
              fi
              ;;
            *)
              command_text="fluoh source check --skip-release-checks ."
              check_command=(fluoh source check --skip-release-checks .)
              ;;
          esac

          set +e
          "${check_command[@]}" > "$log_file" 2>&1
          status=$?
          set -e

          cat "$log_file"

          result="failed"
          if [ "$status" -eq 0 ]; then
            result="passed"
          fi

          {
            echo "## Source validation"
            echo
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Command: \`$command_text\`"
            echo "- Result: $result"
            echo
            echo "<details><summary>fluoh source check output</summary>"
            echo
            echo '```text'
            cat "$log_file"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
